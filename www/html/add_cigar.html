    <h1>Add to Cigar Review Journal</h1>   
    <div id="add_cigar"></div>
    <!-- Cigar submission form -->
<form id="cigarForm">
  <h2>Submit a New Cigar</h2>
  <div>
    <label>Brand: <input type="text" name="brand" required></label>
    <label>Name: <input type="text" name="name" required></label>
  </div>
  <div>
    <label>Origin: <input type="text" name="origin"></label>
    <label>Wrapper: <input type="text" name="wrapper"></label>
    <label>Binder: <input type="text" name="binder"></label>
  </div>
  <div>
    <label>Profile: <input type="text" name="profile"></label>
    <label>Pressed: <input type="checkbox" name="pressed"></label>
    <label>Tasty Tip: <input type="checkbox" name="tasty_tip"></label>
  </div>
  <div>
    <label>Spicy Level (0–10): <input type="number" name="spicy" min="0" max="10"></label>
    <label>Rating (0–10): <input type="number" name="rating" min="0" max="10"></label>
  </div>
  <div>
    <label>Kyle’s Rating: <input type="number" name="kyle_rating" min="0" max="10"></label>
    <label>John’s Rating: <input type="number" name="john_rating" min="0" max="10"></label>
  </div>
  <div>
    <label>Length (mm): <input type="number" name="length"></label>
    <label>Ring Gauge: <input type="number" name="ring"></label>
  </div>
  <div>
    <label>Image URL: <input type="text" name="image_ref"></label>
  </div>
  <div>
    <label>Kyle’s Review:<br>
      <textarea name="kyle_review" rows="2"></textarea>
    </label>
  </div>
  <div>
    <label>John’s Review:<br>
      <textarea name="john_review" rows="2"></textarea>
    </label>
  </div>
  <div>
    <label>General Review:<br>
      <textarea name="review" rows="2"></textarea>
    </label>
  </div>
  <div>
    <label>Authentic Human Review:<br>
      <textarea name="authentic_human_review" rows="2"></textarea>
    </label>
  </div>
  <button type="submit">Submit Cigar</button>
</form>
    <script src="js/dark_mode.js?v=1"></script>
    <script src="js/add_cigar.js?v=.01"></script>
</body>
</html>
