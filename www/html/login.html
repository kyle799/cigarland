<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cigarland — Login</title>
    <link rel="stylesheet" href="style.css?v=27">
    <link rel="icon" href="pictures/favicon.ico" type="image/x-icon">
    <script>!function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}();</script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <nav class="top-nav">
        <ul class="nav-list">
            <li><a href="/">Cigars</a></li>
            <li id="nav-auth"></li>
            <li>
                <label class="switch" title="Toggle dark mode">
                    <input type="checkbox" id="themeSwitch">
                    <span class="slider"></span>
                </label>
            </li>
        </ul>
    </nav>

    <div class="login-form">
        <h2>Cigarland</h2>
        <a href="/login" style="display:block; text-decoration:none;">
            <button type="button">Login with Google</button>
        </a>
    </div>

    <script src="js/dark_mode.js?v=1"></script>
    <script src="js/nav.js?v=1"></script>
    <script src="js/bg_canvas.js?v=1"></script>
</body>
</html>
